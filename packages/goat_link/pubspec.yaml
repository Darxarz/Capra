name: goat_link
description: Android side of Goat Link. Opens the PC collection through Goat Explorer's document provider; no network code and no tokens here.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.goat.link
        pluginClass: GoatLinkPlugin
