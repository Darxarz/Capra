// Written in Java on purpose: the app's Gradle setup and CI regenerate android/,
// and a Java-only plugin does not depend on which Kotlin plugin they choose.
group = "dev.goat.link"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "dev.goat.link"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
