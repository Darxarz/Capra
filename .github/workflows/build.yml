name: Build GOAT (Windows + Android)

# Запускается при каждом изменении в репозитории и вручную (кнопка Run workflow)
on:
  push:
    branches: [main]
  workflow_dispatch:

# нужно право создавать релизы (для автообновления приложения)
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить JDK 17 (для Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Включить поддержку Windows
        run: flutter config --enable-windows-desktop

      - name: Сгенерировать платформенные файлы (windows + android)
        run: flutter create --project-name goat --platforms=windows,android .

      # правим android-конфиг: minSdk 24 (требует onnxruntime) и отключаем
      # инкрементальную компиляцию Kotlin (в CI pub-кэш на C:, проект на D: —
      # кросс-дисковый кэш ломает сборку)
      - name: Поправить android-конфиг приложения
        shell: pwsh
        run: |
          # приложение: minSdk 24 (требует onnxruntime), compileSdk 36
          $app = if (Test-Path 'android/app/build.gradle.kts') { 'android/app/build.gradle.kts' } else { 'android/app/build.gradle' }
          $c = Get-Content $app -Raw
          $c = $c -replace 'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24'
          $c = $c -replace 'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24'
          $c = $c -replace 'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36'
          Set-Content $app $c
          # кросс-дисковый pub-кэш (C:) vs проект (D:) ломает kotlin incremental
          Add-Content android/gradle.properties "`nkotlin.incremental=false"
          # доступ к фото и видео устройства через MediaStore (как обычные галереи):
          # READ_MEDIA_IMAGES/VIDEO (Android 13+), READ_MEDIA_VISUAL_USER_SELECTED
          # (частичный доступ, Android 14), READ_EXTERNAL_STORAGE (до Android 12).
          $m = 'android/app/src/main/AndroidManifest.xml'
          $mc = Get-Content $m -Raw
          if ($mc -notmatch 'READ_MEDIA_IMAGES') {
            $perms = "    <uses-permission android:name=`"android.permission.INTERNET`"/>`n    <uses-permission android:name=`"android.permission.CAMERA`"/>`n    <uses-permission android:name=`"android.permission.READ_MEDIA_IMAGES`"/>`n    <uses-permission android:name=`"android.permission.READ_MEDIA_VIDEO`"/>`n    <uses-permission android:name=`"android.permission.READ_MEDIA_VISUAL_USER_SELECTED`"/>`n    <uses-permission android:name=`"android.permission.READ_EXTERNAL_STORAGE`" android:maxSdkVersion=`"32`"/>`n    "
            $mc = $mc -replace '(<manifest[^>]*>\s*)', "`$1$perms"
          }
          if ($mc -notmatch 'READ_MEDIA_VIDEO') {
            $vperm = "    <uses-permission android:name=`"android.permission.READ_MEDIA_VIDEO`"/>`n    "
            $mc = $mc -replace '(<manifest[^>]*>\s*)', "`$1$vperm"
          }
          # «Доступ ко всем файлам» — опционально, ТОЛЬКО для секретных
          # .nomedia-папок (их прячет MediaStore). Запрашивается из настроек.
          if ($mc -notmatch 'MANAGE_EXTERNAL_STORAGE') {
            $mperm = "    <uses-permission android:name=`"android.permission.MANAGE_EXTERNAL_STORAGE`"/>`n    "
            $mc = $mc -replace '(<manifest[^>]*>\s*)', "`$1$mperm"
          }
          # фоновый сервер раздачи: foreground-сервис типа dataSync (Android 14+
          # требует и разрешение, и объявление сервиса с этим типом)
          if ($mc -notmatch 'FOREGROUND_SERVICE_DATA_SYNC') {
            $fperm = "    <uses-permission android:name=`"android.permission.FOREGROUND_SERVICE`"/>`n    <uses-permission android:name=`"android.permission.FOREGROUND_SERVICE_DATA_SYNC`"/>`n    <uses-permission android:name=`"android.permission.POST_NOTIFICATIONS`"/>`n    "
            $mc = $mc -replace '(<manifest[^>]*>\s*)', "`$1$fperm"
          }
          if ($mc -notmatch 'flutter_foreground_task.service.ForegroundService') {
            $svc = "`n        <service android:name=`"com.pravera.flutter_foreground_task.service.ForegroundService`" android:foregroundServiceType=`"dataSync`" android:exported=`"false`" android:stopWithTask=`"true`"/>`n    "
            $mc = $mc -replace '(<application[^>]*>)', "`$1$svc"
          }
          # raw-путь к медиа на Android 10 (dart:io читает файлы по пути)
          if ($mc -notmatch 'requestLegacyExternalStorage') {
            $mc = $mc -replace '(<application)', '$1 android:requestLegacyExternalStorage="true"'
          }
          # локальная сеть: клиент тянет фото по http:// с другого устройства —
          # Android по умолчанию блокирует cleartext-трафик, разрешаем его
          if ($mc -notmatch 'usesCleartextTraffic') {
            $mc = $mc -replace '(<application)', '$1 android:usesCleartextTraffic="true"'
          }
          # имя приложения на устройстве — GOAT (вместо служебного aurora_gallery)
          $mc = $mc -replace 'android:label="[^"]+"', 'android:label="GOAT"'
          Set-Content $m $mc
          Write-Host "app minSdk 24 / compileSdk 36 / доступ к фото (MediaStore) / label=GOAT"

      # Постоянная подпись релиза: один ключ из секретов GitHub. Иначе каждая
      # сборка подписывается случайным debug-ключом → новая версия не ставится
      # поверх старой («приложение не установлено»). Ключ в код не попадает.
      - name: Настроить подпись Android релиза
        shell: pwsh
        env:
          KS_B64: ${{ secrets.GOAT_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KS_B64) { Write-Host "нет keystore — остаётся debug-подпись"; exit 0 }
          [IO.File]::WriteAllBytes("android/app/goat-release.jks", [Convert]::FromBase64String($env:KS_B64))
          $app = if (Test-Path 'android/app/build.gradle.kts') { 'android/app/build.gradle.kts' } else { 'android/app/build.gradle' }
          $c = Get-Content $app -Raw
          if ($app -like '*.kts') {
            $sign = "`n    signingConfigs {`n        create(`"release`") {`n            storeFile = file(`"goat-release.jks`")`n            storePassword = System.getenv(`"GOAT_STORE_PW`")`n            keyAlias = System.getenv(`"GOAT_KEY_ALIAS`")`n            keyPassword = System.getenv(`"GOAT_KEY_PW`")`n        }`n    }`n"
            if ($c -notmatch 'goat-release\.jks') { $c = $c -replace '(android\s*\{)', "`$1$sign" }
            $c = $c -replace 'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("release")'
          } else {
            $sign = "`n    signingConfigs {`n        release {`n            storeFile file(`"goat-release.jks`")`n            storePassword System.getenv(`"GOAT_STORE_PW`")`n            keyAlias System.getenv(`"GOAT_KEY_ALIAS`")`n            keyPassword System.getenv(`"GOAT_KEY_PW`")`n        }`n    }`n"
            if ($c -notmatch 'goat-release\.jks') { $c = $c -replace '(android\s*\{)', "`$1$sign" }
            $c = $c -replace 'signingConfig\s+signingConfigs\.debug', 'signingConfig signingConfigs.release'
          }
          Set-Content $app $c
          Write-Host "подпись релиза настроена (постоянный ключ)"

      # новый MSVC на раннере делает ошибкой устаревшие <experimental/coroutine>
      # в permission_handler_windows — глушим рекомендованным define;
      # заодно ставим видимое название окна = GOAT (exe собирается под
      # именем goat.exe — это имя проекта в flutter create выше).
      - name: Поправить windows-конфиг
        shell: pwsh
        run: |
          $f = 'windows/CMakeLists.txt'
          $c = Get-Content $f -Raw
          if ($c -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE') {
            $c = $c -replace '(project\([^\)]*\))', "`$1`r`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
            Set-Content $f $c
            Write-Host "windows: coroutine deprecation suppressed"
          }
          # заголовок окна = GOAT (по умолчанию был бы 'goat')
          $mp = 'windows/runner/main.cpp'
          if (Test-Path $mp) {
            $mc = Get-Content $mp -Raw
            $mc = $mc -replace 'L"goat"', 'L"GOAT"'
            Set-Content $mp $mc
          }
          # ProductName/FileDescription = GOAT (по умолчанию 'goat')
          $rc = 'windows/runner/Runner.rc'
          if (Test-Path $rc) {
            $rcc = Get-Content $rc -Raw
            $rcc = $rcc -replace '"goat"', '"GOAT"'
            Set-Content $rc $rcc
          }
          Write-Host "windows: window title = GOAT"

      - name: Зависимости
        run: flutter pub get

      # часть плагинов (особенно старый onnxruntime) собирается под низкий
      # compileSdk и конфликтует с новыми (flutter_plugin_android_lifecycle хочет 36).
      # Поднимаем compileSdk до 36 прямо в build.gradle плагинов в pub-кэше.
      - name: Поднять compileSdk у плагинов (Android)
        shell: pwsh
        run: |
          $roots = @($env:PUB_CACHE, "$env:LOCALAPPDATA\Pub\Cache", "$env:APPDATA\Pub\Cache") |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($root in $roots) {
            Get-ChildItem "$root\hosted\pub.dev" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              foreach ($name in @('android\build.gradle', 'android\build.gradle.kts')) {
                $f = Join-Path $_.FullName $name
                if (Test-Path $f) {
                  $c = Get-Content $f -Raw
                  $n = $c -replace 'compileSdkVersion\s+(flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36' `
                          -replace 'compileSdk\s+(flutter\.compileSdkVersion|\d+)', 'compileSdk 36' `
                          -replace 'compileSdk\s*=\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk = 36' `
                          -replace 'onnxruntime-android:[0-9.]+', 'onnxruntime-android:1.20.0'
                  if ($n -ne $c) { Set-Content $f $n; Write-Host "patched $($_.Name)" }
                }
              }
            }
          }

      # Иконка приложения (Android mipmap + Windows .ico) — flutter_launcher_icons
      # перезаписывает иконки в свежесозданных windows/android папках своей PNG.
      - name: Сгенерировать иконку приложения
        run: dart run flutter_launcher_icons

      # ───────────────── Windows ─────────────────
      - name: Собрать приложение под Windows
        run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      # пакет onnxruntime бандлит старый ONNX Runtime (1.15.1) — подменяем его
      # на свежий официальный, чтобы грузилась модель тегирования v3 (opset 4).
      - name: Обновить onnxruntime.dll до свежего (для модели v3)
        shell: pwsh
        run: |
          $ver = '1.20.1'
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-$ver.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort -Force
          Copy-Item "ort/onnxruntime-win-x64-$ver/lib/onnxruntime.dll" "build/windows/x64/runner/Release/onnxruntime.dll" -Force
          Write-Host "onnxruntime.dll заменён на $ver"

      - name: Упаковать Windows в zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath GOAT-windows.zip -Force

      # ───────────────── Android ─────────────────
      - name: Собрать APK под Android
        env:
          GOAT_STORE_PW: ${{ secrets.GOAT_KEYSTORE_PASSWORD }}
          GOAT_KEY_PW: ${{ secrets.GOAT_KEY_PASSWORD }}
          GOAT_KEY_ALIAS: ${{ secrets.GOAT_KEY_ALIAS }}
        run: flutter build apk --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Переименовать APK
        shell: pwsh
        run: Copy-Item build/app/outputs/flutter-apk/app-release.apk GOAT.apk -Force

      # ───────────────── артефакты и релиз ─────────────────
      - name: Выложить артефакты
        uses: actions/upload-artifact@v5
        with:
          name: goat-builds
          path: |
            GOAT-windows.zip
            GOAT.apk

      # создаём релиз с zip (Windows) и apk (Android)
      - name: Создать релиз с новой версией
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" GOAT-windows.zip GOAT.apk
          --repo ${{ github.repository }}
          --title "Сборка ${{ github.run_number }}"
          --notes "Автоматическая сборка из коммита ${{ github.sha }}"
          --latest

  # ───────────────────────── Linux ─────────────────────────
  # Отдельный job на ubuntu (Linux-сборка не собирается на windows-раннере).
  # Стартует после основного job (релиз уже создан) и докладывает .tar.gz туда.
  linux:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Системные зависимости Linux-десктопа
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libjsoncpp-dev libmpv-dev mpv

      - name: Включить поддержку Linux
        run: flutter config --enable-linux-desktop

      - name: Сгенерировать платформенные файлы (linux)
        run: flutter create --project-name goat --platforms=linux .

      - name: Зависимости
        run: flutter pub get

      - name: Собрать приложение под Linux
        run: flutter build linux --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Упаковать Linux в tar.gz
        run: tar -czf GOAT-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Выложить артефакт
        uses: actions/upload-artifact@v5
        with:
          name: goat-linux
          path: GOAT-linux.tar.gz

      - name: Доложить Linux-сборку в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "build-${{ github.run_number }}" GOAT-linux.tar.gz
          --repo ${{ github.repository }} --clobber
