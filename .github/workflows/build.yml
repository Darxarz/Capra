name: Build Windows app

# Запускается при каждом изменении в репозитории и вручную (кнопка Run workflow)
on:
  push:
    branches: [main]
  workflow_dispatch:

# нужно право создавать релизы (для автообновления приложения)
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Включить поддержку Windows
        run: flutter config --enable-windows-desktop

      - name: Сгенерировать платформенные файлы (windows/)
        run: flutter create --project-name aurora_gallery --platforms=windows .

      - name: Зависимости
        run: flutter pub get

      # номер сборки (${{ github.run_number }}) вшивается в приложение —
      # по нему оно понимает, что вышла версия новее
      - name: Собрать приложение под Windows
        run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Упаковать в zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Capra-windows.zip -Force

      - name: Выложить готовое приложение как артефакт
        uses: actions/upload-artifact@v5
        with:
          name: aurora-gallery-windows
          path: build/windows/x64/runner/Release

      # создаём релиз с готовым zip — отсюда приложение скачивает обновления
      - name: Создать релиз с новой версией
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" Capra-windows.zip
          --repo ${{ github.repository }}
          --title "Сборка ${{ github.run_number }}"
          --notes "Автоматическая сборка из коммита ${{ github.sha }}"
          --latest
