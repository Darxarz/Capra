name: goat
description: GOAT — Gallery Organizer & Auto-Tagger. Быстрая, плотная и стильная галерея с авто-тегами.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  http: ^1.2.0
  path: ^1.9.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  onnxruntime: ^1.4.1
  image: ^4.9.1
  permission_handler: ^12.0.3
  crypto: ^3.0.3
  photo_manager: ^3.6.1
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Иконка приложения для Android и Windows. Генерация:
#   dart run flutter_launcher_icons
# В CI это запускается автоматически после flutter create.
# Адаптивные иконки специально НЕ включаем: на части лаунчеров обрезались
# бы рога/уши козла (они у краёв), а легаси-PNG показывают изображение
# целиком на любом устройстве.
flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true