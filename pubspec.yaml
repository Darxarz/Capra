name: aurora_gallery
description: Aurora — быстрая, плотная и стильная галерея с настраиваемыми темами.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  http: ^1.2.0
  path: ^1.9.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  onnxruntime: ^1.4.1
  image: ^4.9.1
  permission_handler: ^12.0.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true